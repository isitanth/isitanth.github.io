<text x="132" y="52.55" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#3a3a38" text-anchor="middle" data-owner="L1">PipelineController</text>
<text x="132" y="70.2" font-size="12" font-weight="400" fill="#5f5e5a" text-anchor="middle" data-owner="L1">writes one line</text>
<text x="132" y="86.2" font-size="12" font-weight="400" fill="#5f5e5a" text-anchor="middle" data-owner="L1">as each utterance ends</text>
<text x="132" y="180.55" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#3a3a38" text-anchor="middle" data-owner="L2">UtteranceLog</text>
<text x="132" y="198.2" font-size="12" font-weight="400" fill="#5f5e5a" text-anchor="middle" data-owner="L2">one <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12">O_APPEND</tspan> write</text>
<text x="132" y="214.2" font-size="12" font-weight="400" fill="#5f5e5a" text-anchor="middle" data-owner="L2">never throws</text>
<text x="132" y="308.55" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#3a3a38" text-anchor="middle" data-owner="L3">logs/YYYY-MM-DD.jsonl</text>
<text x="132" y="326.2" font-size="12" font-weight="400" fill="#5f5e5a" text-anchor="middle" data-owner="L3">one line per utterance</text>
<text x="132" y="342.2" font-size="12" font-weight="400" fill="#5f5e5a" text-anchor="middle" data-owner="L3">13 keys, file 0600</text>
<text x="132" y="436.55" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#3a3a38" text-anchor="middle" data-owner="L4">LogReader</text>
<text x="132" y="454.2" font-size="12" font-weight="400" fill="#5f5e5a" text-anchor="middle" data-owner="L4">newest first</text>
<text x="132" y="470.2" font-size="12" font-weight="400" fill="#5f5e5a" text-anchor="middle" data-owner="L4">skips a half-written line</text>
<text x="132" y="564.9" font-size="14" font-weight="500" fill="#3a3a38" text-anchor="middle" data-owner="L5">Menu bar panel</text>
<text x="132" y="582.2" font-size="12" font-weight="400" fill="#5f5e5a" text-anchor="middle" data-owner="L5">last line, then a recent list</text>
<text x="132" y="598.2" font-size="12" font-weight="400" fill="#5f5e5a" text-anchor="middle" data-owner="L5">live from <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12">lastRecord</tspan></text>
<text x="556" y="436.9" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" data-owner="L6">Settings › Log</text>
<text x="556" y="454.2" font-size="12" font-weight="400" fill="#0f6e56" text-anchor="middle" data-owner="L6">filters, Reveal in Finder</text>
<text x="556" y="470.2" font-size="12" font-weight="400" fill="#0f6e56" text-anchor="middle" data-owner="L6">Clear History</text>
<text x="556" y="308.55" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#712b13" text-anchor="middle" data-owner="L7">LogHistory</text>
<text x="556" y="326.2" font-size="12" font-weight="400" fill="#993c1d" text-anchor="middle" data-owner="L7">deletes every day file</text>
<text x="556" y="342.2" font-size="12" font-weight="400" fill="#993c1d" text-anchor="middle" data-owner="L7">panel or Log tab, confirmed</text>
