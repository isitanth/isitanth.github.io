<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 688" width="1020" height="1032" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">The log: what Hark keeps</title>
<desc id="d">Reading order: PipelineController, UtteranceLog, the day file logs/YYYY-MM-DD.jsonl, LogReader, the menu bar panel, Settings › Log and LogHistory. The panel&#x27;s RECENT list shows 5 rows and scrolls through up to 50. The panel&#x27;s Clear… and Settings › Log both call AppModel.clearHistory after a confirmation; the drawing keeps one edge into LogHistory, from Settings › Log, and its detail names both places. The logs folder is created at 0700 and each day file at 0600. Sources: PipelineController.swift, UtteranceLog.swift, UtteranceRecord.swift, LogReader.swift, RecentFeed.swift, AppModel.swift, LogSettingsView.swift, LogHistory.swift and PanelView.swift. Drawn from Hark 0.0.4, commit 228466c.</desc>
<defs><marker id="arr-20c" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="688" fill="#ffffff"/>
<g class="edge" data-id="e:L1-L2" data-from="L1" data-to="L2"><path class="edge-line" d="M132 104 L132 150" fill="none" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arr-20c)"/><text x="142" y="132" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#2c2c2a" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" data-owner="e:L1-L2">append(_:)</text></g>
<g class="edge" data-id="e:L2-L3" data-from="L2" data-to="L3"><path class="edge-line" d="M132 232 L132 278" fill="none" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arr-20c)"/><text x="142" y="260" font-size="12" font-weight="400" fill="#2c2c2a" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" data-owner="e:L2-L3">one line</text></g>
<g class="edge" data-id="e:L3-L4" data-from="L3" data-to="L4"><path class="edge-line" d="M132 360 L132 406" fill="none" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arr-20c)"/><text x="142" y="388" font-size="12" font-weight="400" fill="#2c2c2a" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" data-owner="e:L3-L4">read back</text></g>
<g class="edge" data-id="e:L4-L5" data-from="L4" data-to="L5"><path class="edge-line" d="M132 488 L132 534" fill="none" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arr-20c)"/><text x="142" y="516" font-size="12" font-weight="400" fill="#2c2c2a" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" data-owner="e:L4-L5">200 at launch</text></g>
<g class="edge" data-id="e:L4-L6" data-from="L4" data-to="L6"><path class="edge-line" d="M240 448 L454 448" fill="none" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arr-20c)"/><text x="348" y="440" font-size="12" font-weight="400" fill="#2c2c2a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" data-owner="e:L4-L6">≤ 500, filtered</text></g>
<g class="edge" data-id="e:L6-L7" data-from="L6" data-to="L7"><path class="edge-line" d="M556 408 L556 362" fill="none" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arr-20c)"/><text x="566" y="388" font-size="12" font-weight="400" fill="#2c2c2a" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" data-owner="e:L6-L7">Clear History</text></g>
