<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1248" width="360" height="1248" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">From the samples to the transcript</title>
<desc id="d">Reading order: PipelineController, SwappableTranscriptionEngine, the Transcriber with its four steps (ClipChunks, SamplePadding, whisper_full and HallucinationFilter), PipelineReducer, UtteranceResolver, and the phases idle and asking. The Transcript returns to PipelineController, which hands it to the pure reducer as the transcribed event; the line from HallucinationFilter to PipelineReducer is that hand-over, drawn short. A cancel (⌃⌥Esc) arms the abort flag, and whisper checks it between graph computes, so an in-flight whisper_full returns early. A Transcript holds the raw text, the normalized text and the model tier. Sources: PipelineController.swift, SwappableTranscriptionEngine.swift, Transcriber.swift, ClipChunks.swift, SamplePadding.swift, HallucinationFilter.swift, PipelineReducer.swift and UtteranceResolver.swift. Drawn from Hark 0.0.4, commit 228466c.</desc>
