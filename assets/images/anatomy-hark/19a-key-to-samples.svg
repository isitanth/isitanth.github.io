<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 664" width="1020" height="996" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">From the key to the samples</title>
<desc id="d">Reading order: the talk and Ask keys, the KeyboardShortcuts package, HotkeyBridge, PipelineController, AXFocusProbe, AudioCapture and its AVCaptureSession, CapturePolicy, and the phases transcribing and idle. The Ask key reaches PipelineController through AppModel, which reads the selection first, and an ask about a selection takes its app from the selection and is not probed. CapturePolicy is the reducer&#x27;s check on the summary: the phase is already transcribing from key up, a capture that passes goes on to whisper, and one that fails ends in idle with its log line. SampleBuffer reserves one minute and caps a capture at 30 minutes, about 115 MB; a lost device or the limit ends the capture, and ⌃⌥Esc during capture closes the session and drops the samples. Sources: HotkeyBridge.swift, TriggerGate.swift, AppModel.swift, PipelineController.swift, PipelineReducer.swift, AXFocusProbe.swift, AudioCapture.swift, CaptureSummary.swift and SampleBuffer.swift. Drawn from Hark 0.0.4, commit 228466c.</desc>
