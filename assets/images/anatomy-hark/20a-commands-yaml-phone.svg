<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 952" width="360" height="952" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">commands.yaml: the rules you write</title>
<desc id="d">Reading order: commands.yaml, DispatchFileWatcher, Settings › Commands and Ask, ConfigStore, then ResolutionSettings, AskSettings and HealthStatus. DispatchFileWatcher keeps vnode sources on the file and on its folder; ConfigStore re-reads 100 ms after the last change, makes a valid file the config in force and copies it to .commands.lastgood.yaml, and on a bad file keeps the last good config and publishes the error with its line and column. Settings writes through a temporary file, fsync and rename(2), and passes the diskRevision of the snapshot it edited, so it never writes over a newer edit. On launch, a missing file, or a version 1 or 2 default nobody edited (matched by its SHA-256), is replaced by the bundled default. Sources: CommandConfig.swift, CommandConfigSchema.swift, FileWatching.swift, ConfigStore.swift, ConfigFileIO.swift, AppModel.swift, UtteranceResolver.swift, AskEngine.swift and HealthStatus.swift. Drawn from Hark 0.0.4, commit 228466c.</desc>
