<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 712" width="1020" height="1068" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Models: the ones you choose</title>
<desc id="d">Reading order: Settings › Model, DownloadCoordinator, ModelCatalog, ModelStore, URLSessionDownloader, huggingface.co, the models/ folder and the Transcriber. Each tier moves through nine install states; a download lands in models/.staging, with a .resume sidecar when it is paused, an encoder zip is unpacked with ditto, and every file is hashed in 1 MiB chunks before the rename. whisper.cpp derives the encoder name from the weights, without the quantisation suffix and with -encoder.mlmodelc, and the three Core ML encoders weigh 163.1, 567.8 and 1,175.7 MB. This downloader is one of the two network clients of Hark 0.0.4; Ask&#x27;s LLMClient is the other. Sources: ModelsModel.swift, DownloadCoordinator.swift, ModelCatalog.swift, ModelStore.swift, ModelLayout.swift, URLSessionDownloader.swift, DownloadOriginPolicy.swift and Transcriber.swift. Drawn from Hark 0.0.4, commit 228466c.</desc>
