<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1392" height="560" viewBox="4 100 1392 560" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Configuration, models and the log: the three files Hark lives by</title>
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#777777"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#BC4C00"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8FA9D6"/></marker></defs>
<rect width="1400" height="700" fill="#fff"/>
<rect x="30" y="74" width="16" height="12" rx="3" ry="3" fill="#fff" stroke="#BFBFBF" stroke-width="1.2"/>
<rect x="220" y="74" width="16" height="12" rx="3" ry="3" fill="#FFF3E8" stroke="#BC4C00" stroke-width="1.2" stroke-dasharray="6 4"/>
<rect x="410" y="74" width="16" height="12" rx="3" ry="3" fill="#EEF3FB" stroke="#8FA9D6" stroke-width="1.2"/>
<rect x="30" y="110" width="430" height="540" rx="14" ry="14" fill="#F4F4F4" stroke="#E3E3E3" stroke-width="1"/>
<text x="44" y="130" font-size="11" font-weight="700" fill="#777777" text-anchor="start">COMMANDS.YAML · CORE-09, DS-01</text>
<rect x="46" y="140" width="398" height="70" rx="10" ry="10" fill="#EEF3FB" stroke="#8FA9D6" stroke-width="1.4"/>
<text x="58" y="162" font-size="13" font-weight="700" fill="#111111" text-anchor="start">commands.yaml (v2)</text>
<text x="58" y="179" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">defaults.threshold · open_verbs · fillers · commands[] (id, action, app, aliases)</text>
<text x="58" y="193" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">apps.&lt;bundle id&gt;.insert · 256 KiB max, no anchors, unknown keys get a hint</text>
<rect x="46" y="240" width="398" height="60" rx="10" ry="10" fill="#fff" stroke="#BFBFBF" stroke-width="1.4"/>
<text x="58" y="262" font-size="13" font-weight="700" fill="#111111" text-anchor="start">DispatchFileWatcher</text>
<text x="58" y="279" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">vnode sources on the folder and the file, re-opened on a new inode</text>
<text x="58" y="293" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">100 ms debounce · identical bytes publish nothing</text>
<rect x="46" y="330" width="398" height="100" rx="10" ry="10" fill="#fff" stroke="#BFBFBF" stroke-width="1.4"/>
<text x="56" y="345" font-size="10" font-weight="500" fill="#777777" text-anchor="start">actor</text>
<text x="58" y="362" font-size="13" font-weight="700" fill="#111111" text-anchor="start">ConfigStore</text>
<text x="58" y="379" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">parse with Yams → ConfigSnapshot { config, source, revision, error }</text>
<text x="58" y="393" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">valid → source .file, and a copy to .commands.lastgood.yaml</text>
<text x="58" y="407" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">invalid → keep the config in force (.lastGood), set error, log it</text>
<text x="58" y="421" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">cold start with a broken file → the last-good copy, else no commands</text>
<rect x="46" y="460" width="190" height="80" rx="10" ry="10" fill="#fff" stroke="#BFBFBF" stroke-width="1.4"/>
<text x="58" y="482" font-size="13" font-weight="700" fill="#111111" text-anchor="start">ResolutionSettings</text>
<text x="58" y="499" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">CommandMatcher rebuilt</text>
<text x="58" y="513" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">apps: modes, threshold</text>
<text x="58" y="527" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">→ UtteranceResolver</text>
<rect x="254" y="460" width="190" height="80" rx="10" ry="10" fill="#fff" stroke="#BFBFBF" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="266" y="482" font-size="13" font-weight="700" fill="#111111" text-anchor="start">Health, not failure</text>
<text x="266" y="499" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">configInvalid → error icon in</text>
<text x="266" y="513" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">the menu bar, a panel row with</text>
<text x="266" y="527" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">line and column, Reveal</text>
<rect x="46" y="570" width="398" height="64" rx="10" ry="10" fill="#fff" stroke="#BFBFBF" stroke-width="1.4"/>
<text x="58" y="592" font-size="13" font-weight="700" fill="#111111" text-anchor="start">Settings › Commands writes it back</text>
<text x="58" y="609" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">write(basedOn: revision): mkstemp, fsync, rename · refused on conflict,</text>
<text x="58" y="623" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">when the file on disk is broken (degraded), or on an I/O error</text>
<path d="M245 210 L245 240" fill="none" stroke="#777777" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#ag)"/>
<text x="289.0" y="219.0" font-size="10.5" font-weight="500" fill="#444444" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">file change</text>
<path d="M245 300 L245 330" fill="none" stroke="#777777" stroke-width="1.8" marker-end="url(#ag)"/>
<path d="M141 430 L141 460" fill="none" stroke="#777777" stroke-width="1.8" marker-end="url(#ag)"/>
<path d="M349 430 L349 460" fill="none" stroke="#777777" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ag)"/>
<path d="M46 602 L34 602 L34 175 L46 175" fill="none" stroke="#777777" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#ag)"/>
<text x="24" y="400" font-size="9.5" font-weight="500" fill="#777777" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">write</text>
<rect x="490" y="110" width="430" height="540" rx="14" ry="14" fill="#F4F4F4" stroke="#E3E3E3" stroke-width="1"/>
<text x="504" y="130" font-size="11" font-weight="700" fill="#777777" text-anchor="start">WHISPER MODELS · CORE-03, DS-04, OS-06</text>
<rect x="506" y="140" width="398" height="70" rx="10" ry="10" fill="#fff" stroke="#BFBFBF" stroke-width="1.4"/>
<text x="518" y="162" font-size="13" font-weight="700" fill="#111111" text-anchor="start">ModelCatalog · three tiers, pinned</text>
<text x="518" y="179" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">Small 264 MB + encoder 163 MB · Medium 823 + 568 MB · Large v3 1.08 + 1.18 GB</text>
<text x="518" y="193" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">one Hugging Face commit and one SHA-256 per artefact</text>
<rect x="506" y="240" width="398" height="60" rx="10" ry="10" fill="#fff" stroke="#BFBFBF" stroke-width="1.4"/>
<text x="516" y="255" font-size="10" font-weight="500" fill="#777777" text-anchor="start">actor</text>
<text x="518" y="272" font-size="13" font-weight="700" fill="#111111" text-anchor="start">DownloadCoordinator</text>
<text x="518" y="289" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">per-tier state machine (not installed, downloading, paused, interrupted, installed)</text>
<text x="518" y="303" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">backs the Model tab buttons · nothing starts on its own</text>
<rect x="506" y="330" width="398" height="100" rx="10" ry="10" fill="#fff" stroke="#BFBFBF" stroke-width="1.4"/>
<text x="516" y="345" font-size="10" font-weight="500" fill="#777777" text-anchor="start">actor</text>
<text x="518" y="362" font-size="13" font-weight="700" fill="#111111" text-anchor="start">ModelStore</text>
<text x="518" y="379" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">free-space check (a zip counts twice) → download into models/.staging, resume sidecar</text>
<text x="518" y="393" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">→ SHA-256 streamed in 1 MiB chunks, a mismatch deletes the file → place by rename</text>
<text x="518" y="407" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">→ an encoder zip is expanded with ditto and moved to &lt;model&gt;-encoder.mlmodelc</text>
<text x="518" y="421" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">a tier in use cannot be deleted · purge clears the folder</text>
<rect x="506" y="460" width="190" height="80" rx="10" ry="10" fill="#EEF3FB" stroke="#8FA9D6" stroke-width="1.4"/>
<text x="686" y="475" font-size="10" font-weight="700" fill="#777777" text-anchor="end">OS-06</text>
<text x="518" y="492" font-size="13" font-weight="700" fill="#111111" text-anchor="start">URLSessionDownloader</text>
<text x="518" y="509" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">https, huggingface.co and hf.co</text>
<text x="518" y="523" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">only, checked on every redirect</text>
<text x="518" y="537" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">the only network code in Hark</text>
<rect x="714" y="460" width="190" height="80" rx="10" ry="10" fill="#fff" stroke="#BFBFBF" stroke-width="1.4"/>
<text x="726" y="482" font-size="13" font-weight="700" fill="#111111" text-anchor="start">ModelsModel.load</text>
<text x="726" y="499" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">builds a Transcriber, swaps it in</text>
<text x="726" y="513" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">SwappableTranscriptionEngine,</text>
<text x="726" y="527" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">warms it up with 1.25 s of silence</text>
<rect x="506" y="570" width="398" height="64" rx="10" ry="10" fill="#fff" stroke="#BFBFBF" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="518" y="592" font-size="13" font-weight="700" fill="#111111" text-anchor="start">Core ML encoder, optional</text>
<text x="518" y="609" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">whisper.cpp derives &lt;weights minus -qN_N&gt;-encoder.mlmodelc and loads it if present;</text>
<text x="518" y="623" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">without it the encoder runs on Metal and only whisper’s own log says so</text>
<path d="M705 210 L705 240" fill="none" stroke="#777777" stroke-width="1.8" marker-end="url(#ag)"/>
<path d="M705 300 L705 330" fill="none" stroke="#777777" stroke-width="1.8" marker-end="url(#ag)"/>
<path d="M601 430 L601 460" fill="none" stroke="#777777" stroke-width="1.8" marker-end="url(#ag)"/>
<path d="M809 430 L809 460" fill="none" stroke="#777777" stroke-width="1.8" marker-end="url(#ag)"/>
<text x="809.0" y="439.0" font-size="10.5" font-weight="500" fill="#444444" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">installed</text>
<path d="M809 540 L809 570" fill="none" stroke="#777777" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ag)"/>
<rect x="950" y="110" width="420" height="540" rx="14" ry="14" fill="#F4F4F4" stroke="#E3E3E3" stroke-width="1"/>
<text x="964" y="130" font-size="11" font-weight="700" fill="#777777" text-anchor="start">THE LOG · DS-03 · THE CONTRACT</text>
<rect x="966" y="140" width="388" height="70" rx="10" ry="10" fill="#fff" stroke="#BFBFBF" stroke-width="1.4"/>
<text x="978" y="162" font-size="13" font-weight="700" fill="#111111" text-anchor="start">PipelineController → UtteranceLog.append</text>
<text x="978" y="179" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">exactly one line per utterance, on the transition that ends it</text>
<text x="978" y="193" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">O_APPEND, one write(2), folder 0700, file 0600, never throws</text>
<rect x="966" y="240" width="388" height="130" rx="10" ry="10" fill="#EEF3FB" stroke="#8FA9D6" stroke-width="1.4"/>
<text x="978" y="262" font-size="13" font-weight="700" fill="#111111" text-anchor="start">logs/YYYY-MM-DD.jsonl · one line per utterance</text>
<text x="978" y="279" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">ts · duration_ms · transcribe_ms · raw_text · normalized_text</text>
<text x="978" y="293" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">resolution · target_app · action_type · exit_code · error · model_tier</text>
<text x="978" y="307" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">resolution: command · text_inserted · text_clipboard · discarded · failed</text>
<text x="978" y="321" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">secure field: raw_text and normalized_text are null</text>
<text x="978" y="335" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">error: null when nothing went wrong, else one code (diagram 2)</text>
<rect x="966" y="400" width="388" height="70" rx="10" ry="10" fill="#fff" stroke="#BFBFBF" stroke-width="1.4"/>
<text x="978" y="422" font-size="13" font-weight="700" fill="#111111" text-anchor="start">LogReader</text>
<text x="978" y="439" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">newest first, the unfinished last line skipped, undecodable lines counted</text>
<text x="978" y="453" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">filters all · commands · text · errors, 500 lines at most</text>
<rect x="966" y="500" width="185" height="80" rx="10" ry="10" fill="#fff" stroke="#BFBFBF" stroke-width="1.4"/>
<text x="978" y="522" font-size="13" font-weight="700" fill="#111111" text-anchor="start">Panel feed</text>
<text x="978" y="539" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">seeded with 40 lines, then</text>
<text x="978" y="553" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">live from each PipelineSnapshot</text>
<text x="978" y="567" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">LAST + 5 RECENT</text>
<rect x="1169" y="500" width="185" height="80" rx="10" ry="10" fill="#fff" stroke="#BFBFBF" stroke-width="1.4"/>
<text x="1181" y="522" font-size="13" font-weight="700" fill="#111111" text-anchor="start">Settings › Log</text>
<text x="1181" y="539" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">re-reads on a filter change</text>
<text x="1181" y="553" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">or a new line · Reveal in Finder</text>
<text x="1181" y="567" font-size="10.5" font-weight="400" fill="#444444" text-anchor="start">-HarkDebugLogs for screenshots</text>
<path d="M1160 210 L1160 240" fill="none" stroke="#777777" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#ag)"/>
<path d="M1160 370 L1160 400" fill="none" stroke="#777777" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#ag)"/>
<path d="M1058 470 L1058 500" fill="none" stroke="#777777" stroke-width="1.8" marker-end="url(#ag)"/>
<path d="M1261 470 L1261 500" fill="none" stroke="#777777" stroke-width="1.8" marker-end="url(#ag)"/>
<text x="966" y="620" font-size="11" font-weight="700" fill="#111111" text-anchor="start">This is how the app is debugged: no line, no feature.</text>
</svg>